<html lang="en">
<head>
    <title>Document</title>
    <style>
        .container{
            height: 300px;
            position: relative;
            background-color:antiquewhite;
            padding: 20px;
            border: 1px solid black;
            text-align: center;
        }
        .absolute{
            top: 20px;
            right: 20px;
            background-color: aqua;
            padding: 10px;
            text-align: center;
        }
        .general{
            border: 1px solid black ;
            background-color:azure ;
            padding: 30px;
            margin-bottom: 40px ;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="absolute">hello</div>
        <div class="general">hello</div>
        <div></div>
    </div>
    
</body>
</html>
